<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @font-face {
    font-family: "Pilcrow Rounded";
    font-style: normal;
    font-weight: 700;
    src: url("assets/fonts/pilcrow-rounded-700.woff2") format("woff2");
  }
  @font-face {
    font-family: "Pilcrow Rounded";
    font-style: normal;
    font-weight: 500;
    src: url("assets/fonts/pilcrow-rounded-500.woff2") format("woff2");
  }
  @font-face {
    font-family: "Pilcrow Rounded";
    font-style: normal;
    font-weight: 400;
    src: url("assets/fonts/pilcrow-rounded-400.woff2") format("woff2");
  }
  :root {
    --bg: #0a0710;
    --ink: #f2ecf5;
    --muted: #ab9cba;
    --accent: #ef5f2f;
    --accent-ink: #14070a;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    width: 1200px; height: 630px;
    background: var(--bg);
    color: var(--ink);
    font-family: "Pilcrow Rounded", sans-serif;
    overflow: hidden;
    position: relative;
    padding: 64px 72px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .orb {
    position: absolute; z-index: 0; top: 50%; left: 88%;
    width: 900px; height: 900px; border-radius: 50%;
    translate: -50% -50%;
    background: var(--accent); overflow: hidden;
  }
  .orb::after {
    content: ""; position: absolute; inset: 0; border-radius: inherit;
    background: var(--bg); opacity: 0.22;
  }
  .orb img { width: 100%; height: 100%; object-fit: cover; opacity: 0.8; mix-blend-mode: multiply; }
  .row { position: relative; z-index: 1; display: flex; align-items: center; gap: 16px; }
  .row img { width: 40px; height: 40px; image-rendering: pixelated; }
  .word { font-size: 30px; font-weight: 700; letter-spacing: -0.01em; }
  h1 {
    position: relative; z-index: 1;
    font-size: 76px; font-weight: 700; line-height: 0.96;
    letter-spacing: -0.035em; max-width: 14ch;
  }
  .cmd {
    position: relative; z-index: 1;
    align-self: flex-start;
    display: flex; align-items: center; gap: 14px;
    background: #17101f;
    border-radius: 999px;
    padding: 14px 26px;
    font-family: ui-monospace, Menlo, monospace;
    font-size: 20px;
  }
  .cmd .sigil { color: var(--accent); }
  .stars { position: absolute; inset: 0; z-index: 0; opacity: 0.5; }
</style>
</head>
<body>
  <svg class="stars" viewBox="0 0 1200 630" aria-hidden="true" fill="#f2ecf5">
    <circle cx="120" cy="90" r="1.6"/><circle cx="340" cy="40" r="1.3"/><circle cx="520" cy="120" r="1.5"/>
    <circle cx="700" cy="60" r="1.1"/><circle cx="880" cy="140" r="1.4"/><circle cx="1060" cy="70" r="1.2"/>
    <circle cx="200" cy="520" r="1.4"/><circle cx="420" cy="570" r="1.2"/><circle cx="640" cy="500" r="1.5"/>
    <circle cx="940" cy="560" r="1.3"/><circle cx="1120" cy="470" r="1.1"/>
  </svg>
  <div class="orb"><img src="assets/mars-surface-900.webp" alt=""></div>
  <div class="row"><img src="assets/mars-mark.svg" alt=""> <span class="word">Mars</span></div>
  <h1>The agent lives in your IDE.</h1>
  <span class="cmd"><span class="sigil">$</span>curl -fsSL getmars.eu.cc/install | sh</span>
</body>
</html>
