<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mars OG Card</title>
<style>
  @font-face {
    font-family: "Hanken Grotesk";
    font-style: normal;
    font-weight: 400 800;
    src: url("assets/fonts/hanken-grotesk-latin.woff2") format("woff2");
  }
  @font-face {
    font-family: "Spline Sans Mono";
    font-style: normal;
    font-weight: 400 700;
    src: url("assets/fonts/spline-sans-mono-latin.woff2") format("woff2");
  }
  :root {
    --ground: #faf8f5;
    --plate: #ffffff;
    --plate-2: #f2eee8;
    --ink: #161419;
    --body: #4a4440;
    --soft: #6b625c;
    --mars: #d64a27;
    --mars-deep: #b43618;
    --hair: #e8e2d9;
    --hair-hard: #d4cbc0;
    --sans: "Hanken Grotesk", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --mono: "Spline Sans Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    width: 1200px;
    height: 630px;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--sans);
    overflow: hidden;
    position: relative;
    padding: 48px 60px 42px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .orbit {
    position: absolute;
    top: -60px;
    right: -80px;
    width: 680px;
    height: 680px;
    pointer-events: none;
  }
  .top {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--hair-hard);
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .brand img {
    width: 48px;
    height: 48px;
    image-rendering: pixelated;
  }
  .brand-name {
    font-size: 32px;
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1;
  }
  .brand-sub {
    display: block;
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--soft);
    margin-top: 5px;
  }
  .meta {
    font-family: var(--mono);
    font-size: 13px;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--soft);
    display: flex;
    gap: 22px;
  }
  .meta b { color: var(--ink); font-weight: 600; }

  .mid {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }
  h1 {
    font-size: 74px;
    font-weight: 600;
    line-height: 0.98;
    letter-spacing: -0.036em;
    max-width: 16ch;
  }
  h1 .accent { color: var(--mars); }

  .plate {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 18px;
    background: var(--plate);
    border: 1px solid var(--hair-hard);
    border-radius: 12px;
    padding: 18px 22px;
    box-shadow: 0 2px 6px rgba(22, 20, 25, 0.05), 0 22px 46px -26px rgba(22, 20, 25, 0.22);
  }
  .cmd {
    display: flex;
    align-items: center;
    gap: 14px;
    font-family: var(--mono);
    font-size: 24px;
    font-weight: 500;
    color: var(--ink);
  }
  .cmd .sigil { color: var(--mars-deep); font-weight: 700; }
  .pill {
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #fff;
    background: var(--mars-deep);
    padding: 10px 16px;
    border-radius: 8px;
  }

  .bottom {
    position: relative;
    z-index: 1;
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr)) auto;
    align-items: end;
    gap: 18px;
    padding-top: 20px;
    border-top: 1px solid var(--hair-hard);
  }
  .stat b {
    display: block;
    font-size: 32px;
    font-weight: 600;
    letter-spacing: -0.03em;
    line-height: 1;
    color: var(--ink);
  }
  .stat span {
    display: block;
    margin-top: 6px;
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--mars-deep);
  }
  .domain {
    font-family: var(--mono);
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.08em;
    color: var(--soft);
  }
</style>
</head>
<body>
  <svg class="orbit" viewBox="0 0 680 680" fill="none" aria-hidden="true">
    <g stroke="#d4cbc0" stroke-width="1" opacity="0.55">
      <circle cx="460" cy="340" r="140"/>
      <circle cx="460" cy="340" r="230"/>
      <circle cx="460" cy="340" r="320"/>
    </g>
    <circle cx="460" cy="340" r="230" stroke="#d64a27" stroke-width="1.5" stroke-dasharray="6 9" opacity="0.4"/>
    <circle cx="622" cy="502" r="5.5" fill="#d64a27" opacity="0.72"/>
  </svg>

  <div class="top">
    <div class="brand">
      <img src="assets/mars-mark.svg" alt="Mars">
      <div>
        <span class="brand-name">Mars</span>
        <span class="brand-sub">Coding Agent CLI</span>
      </div>
    </div>
    <div class="meta">
      <span>Targets <b>macOS · Linux · Windows</b></span>
      <span>Licence <b>MIT</b></span>
    </div>
  </div>

  <div class="mid">
    <h1>A coding agent with the IDE <span class="accent">wired in.</span></h1>
    <div class="plate">
      <div class="cmd"><span class="sigil">$</span>curl -fsSL https://getmars.eu.cc/install | sh</div>
      <div class="pill">SHA-256 Verified</div>
    </div>
  </div>

  <div class="bottom">
    <div class="stat"><b>75</b><span>Providers</span></div>
    <div class="stat"><b>34</b><span>Built-in tools</span></div>
    <div class="stat"><b>300k</b><span>Lines of Rust</span></div>
    <div class="stat"><b>6</b><span>Native targets</span></div>
    <div class="domain">getmars.eu.cc</div>
  </div>
</body>
</html>
