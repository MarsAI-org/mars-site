    d="M0 170 V138 h52 v-20 h16 v20 h44 v-30 h14 v30 h40 v-12 h30 v12 h40 v-40 h20 v40 h36 v-24 h40 v-10 h16 v10 h34 v24 h40 v-34 h40 v-8 h16 v8 h30 v34 h50 v-28 h40 v-12 h14 v12 h32 v28 h52 v-36 h18 v36 h46 v-20 h36 v20 h44 v-30 h14 v30 h44 v32 Z"/>
