    <rect x="120" y="156" width="4" height="4"/><rect x="132" y="156" width="4" height="4"/>
    <rect x="330" y="132" width="4" height="4"/><rect x="342" y="132" width="4" height="4"/>
    <rect x="330" y="144" width="4" height="4"/><rect x="342" y="144" width="4" height="4"/>
    <rect x="330" y="156" width="4" height="4"/><rect x="342" y="156" width="4" height="4"/>
    <rect x="520" y="142" width="4" height="4"/><rect x="532" y="142" width="4" height="4"/>
    <rect x="520" y="154" width="4" height="4"/><rect x="532" y="154" width="4" height="4"/>
  </g>
</svg>
